# Potok CI/CD - automatyczne budowanie i skanowanie obrazu Docker.
# Plik jest automatycznie wykrywany i uruchamiany przez GitHub Actions.
name: Skanowanie bezpieczenstwa obrazu Docker

# KIEDY potok ma sie uruchomic:
on:
  push:
    branches: [ main ]        # przy kazdym wyslaniu kodu na galaz main
  workflow_dispatch:          # oraz recznie, przyciskiem w interfejsie GitHub

jobs:
  build-and-scan:
    name: Budowa i skanowanie
    runs-on: ubuntu-latest    # maszyna (runner) hostowana przez GitHub

    steps:
      # Krok 1: pobranie kodu projektu z repozytorium
      - name: Pobranie kodu zrodlowego
        uses: actions/checkout@v4

      # Krok 2: zbudowanie obrazu Docker (wariant niebezpieczny)
      - name: Budowa obrazu Docker
        run: docker build -t app-niebezpieczny:${{ github.sha }} -f Dockerfile .

      # Krok 3: skanowanie obrazu narzedziem Trivy
      - name: Skanowanie obrazu (Trivy)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: app-niebezpieczny:${{ github.sha }}
          scanners: vuln          # skanuj podatnosci CVE
          format: table           # wynik w postaci czytelnej tabeli
          severity: CRITICAL,HIGH,MEDIUM,LOW
